name: Support analytics checks

on:
  push:
    branches:
      - codex/interactive-support-dashboard
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:analytics
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/dashboard-browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-visual-checks
          path: artifacts/*.png
